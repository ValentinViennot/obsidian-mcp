name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  IMAGE: ghcr.io/valentinviennot/obsidian-mcp
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo runtime=true >> "$GITHUB_OUTPUT"
          else
            echo "runtime=$(python3 scripts/ci_release.py changes --base "$BASE" --head "$HEAD")" >> "$GITHUB_OUTPUT"
          fi

  offline:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Enable and exercise mount namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -Urm --propagation private true
      - run: python scripts/ci_tests.py offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-offline
          path: pytest-offline.xml
          if-no-files-found: error

  database:
    name: ${{ matrix.partition }}
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [schema, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Require database and Docker test prerequisites
        run: |
          docker info > /dev/null
          if ! psql --version; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
      - name: Run the disjoint database partition
        env:
          PGVECTOR_TEST_ADMIN_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
          PARTITION: ${{ matrix.partition }}
        run: python scripts/ci_tests.py "$PARTITION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.partition }}
          path: pytest-${{ matrix.partition }}.xml
          if-no-files-found: error

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Secret history scan
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.0 \
            detect --source /repo --redact --no-banner -v --exit-code 1 2>&1 | tee gitleaks.log
          grep -qE '[0-9]+ commits scanned' gitleaks.log
      - name: Vault leak checker
        run: python scripts/check-vault-leak.py
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx -y @fission-ai/openspec@1.3.1 validate --specs --strict

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SECRET_KEY: ci-synthetic-only-secret
      POSTGRES_PASSWORD: ci-synthetic-only-bootstrap-password
      OBSIDIAN_DB_PASSWORD: ci-synthetic-only-runtime-password
      VAULT_HOST_PATH: ./vault
      MCP_HOSTNAME: obsidian-mcp.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate base and proxy overrides
        run: |
          touch .env postgres.env
          docker compose -f docker-compose.yml config -q
          for override in docker-compose.caddy.yml docker-compose.traefik.yml; do
            docker compose -f docker-compose.yml -f "$override" config -q
            docker compose -f docker-compose.yml -f "$override" config --format json \
              | python3 -c 'import json,sys; assert not json.load(sys.stdin)["services"]["obsidian-mcp"].get("ports")'
          done

  image:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the only runtime candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: obsidian-mcp:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/ValentinViennot/obsidian-mcp
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runtime-candidate
          cache-to: type=gha,mode=max,scope=runtime-candidate
      - name: Scan that candidate
        run: |
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile /src/.trivyignore); fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD:/src:ro" "$TRIVY_IMAGE" image --severity HIGH,CRITICAL \
            --exit-code 1 --ignore-unfixed --no-progress --scanners vuln \
            "${ignore[@]}" obsidian-mcp:candidate
      - name: Smoke-test that candidate with synthetic data
        run: scripts/ci_image_smoke.sh obsidian-mcp:candidate
      - name: Preserve the exact tested candidate
        run: |
          mkdir candidate
          docker image inspect obsidian-mcp:candidate --format '{{.Id}}' > candidate/image-id
          docker save obsidian-mcp:candidate | gzip > candidate/image.tar.gz
          cd candidate && sha256sum image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        id: candidate
        with:
          name: runtime-candidate-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  pr-gate:
    name: pr-gate
    if: always()
    needs: [changes, offline, database, security, openspec, compose, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          runtime = needs['changes']['outputs'].get('runtime')
          assert runtime in ('true', 'false'), 'missing change classification'
          for name, result in needs.items():
              expected = 'skipped' if runtime == 'false' and name in ('offline', 'database', 'image') else 'success'
              assert result['result'] == expected, f"{name}: expected {expected}, got {result['result']}"
          PY

  publish:
    if: >-
      github.repository == 'ValentinViennot/obsidian-mcp' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.outputs.runtime == 'true'
    needs: [pr-gate, changes, offline, database, security, openspec, compose, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Publish the tested bytes without rebuilding
        id: release
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          gzip -dc candidate/image.tar.gz | docker load
          expected=$(cat candidate/image-id)
          test "$(docker image inspect obsidian-mcp:candidate --format '{{.Id}}')" = "$expected"
          test "$(docker image inspect obsidian-mcp:candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect obsidian-mcp:candidate --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$GITHUB_REPOSITORY"
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag obsidian-mcp:candidate "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          digest=$(oras resolve "$IMAGE:$tag")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{.Id}}')" = "$expected"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the tested image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true
      - name: Generate exact-source release manifest
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          EVIDENCE: >-
            {"offline":"${{ needs.offline.result }}","schema":"${{ needs.database.result }}",
            "postgres":"${{ needs.database.result }}","security":"${{ needs.security.result }}",
            "openspec":"${{ needs.openspec.result }}","compose":"${{ needs.compose.result }}",
            "image":"${{ needs.image.result }}"}
        run: |
          python3 scripts/ci_release.py manifest --commit "$GITHUB_SHA" --digest "$DIGEST" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence "$EVIDENCE" --output obsidian-mcp-release.json
      - name: Publish immutable release manifest
        id: manifest
        run: |
          tag="release-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          oras push --artifact-type application/vnd.obsidian-mcp.release.v1+json \
            "$IMAGE:$tag" obsidian-mcp-release.json:application/json
          digest=$(oras resolve "$IMAGE:$tag")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Attest release manifest for protected GitOps ingestion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-mcp-release-${{ github.sha }}-${{ github.run_attempt }}
          path: obsidian-mcp-release.json
          if-no-files-found: error
          retention-days: 90
      - name: Trigger protected GitOps ingestion
        if: vars.OBSIDIAN_RELEASE_AUTOMATION_ENABLED == 'true'
        env:
          GITOPS_PIPELINE_TRIGGER_URL: ${{ secrets.GITOPS_PIPELINE_TRIGGER_URL }}
          GITOPS_PIPELINE_TRIGGER_TOKEN: ${{ secrets.GITOPS_PIPELINE_TRIGGER_TOKEN }}
          OBSIDIAN_RELEASE_MANIFEST: ${{ steps.manifest.outputs.reference }}
        run: |
          test -n "$GITOPS_PIPELINE_TRIGGER_URL"
          test -n "$GITOPS_PIPELINE_TRIGGER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$GITOPS_PIPELINE_TRIGGER_URL" \
            --form "token=$GITOPS_PIPELINE_TRIGGER_TOKEN" --form 'ref=main' \
            --form "variables[OBSIDIAN_RELEASE_MANIFEST]=$OBSIDIAN_RELEASE_MANIFEST" \
            --form "variables[USL_SOURCE_REPOSITORY]=$GITHUB_REPOSITORY" \
            --form "variables[USL_SOURCE_REF]=$GITHUB_REF" \
            --form "variables[USL_SOURCE_COMMIT]=$GITHUB_SHA" \
            --form "variables[USL_GITHUB_RUN_ID]=$GITHUB_RUN_ID"
      - name: Release summary
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          MANIFEST: ${{ steps.manifest.outputs.reference }}
        run: |
          # shellcheck disable=SC2016
          printf 'Tested image: `%s@%s`\n\nAttested release manifest: `%s`\n' "$IMAGE" "$DIGEST" "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"
